name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore game project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/game-project"
          mkdir -p "$GITHUB_WORKSPACE/game-project"
          cat payload/part1.b64 payload/part2.b64 payload/part3.b64 payload/part4.b64 | base64 --decode > /tmp/cardsquest.tar.gz
          tar -xzf /tmp/cardsquest.tar.gz -C "$GITHUB_WORKSPACE/game-project"
          test -f "$GITHUB_WORKSPACE/game-project/app/build.gradle"

      - name: Build unsigned release APK
        working-directory: game-project
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare unsigned APK and signing tools
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/signing-package"
          mkdir -p "$OUT/tools/lib"
          UNSIGNED="$GITHUB_WORKSPACE/game-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          cp "$UNSIGNED" "$OUT/13cards-unsigned.apk"
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" "$OUT/tools/apksigner"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$OUT/tools/lib/apksigner.jar"
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" "$OUT/tools/zipalign"
          chmod +x "$OUT/tools/apksigner" "$OUT/tools/zipalign"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$UNSIGNED" | tee "$OUT/badging.txt"
          sha256sum "$UNSIGNED" > "$OUT/unsigned-sha256.txt"

      - name: Upload unsigned release package
        uses: actions/upload-artifact@v4
        with:
          name: 13cards-unsigned-release-package
          path: signing-package/
          if-no-files-found: error
          retention-days: 7
