name: Build Visual Chapter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore visual artwork
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p visual/app/src/main/assets
          base64 --decode visual/assets_b64/living.b64 > visual/app/src/main/assets/living.webp
          base64 --decode visual/assets_b64/corridor.b64 > visual/app/src/main/assets/corridor.webp
          base64 --decode visual/assets_b64/room.b64 > visual/app/src/main/assets/room.webp
          base64 --decode visual/assets_b64/anomaly.b64 > visual/app/src/main/assets/anomaly.webp
          test -s visual/app/src/main/assets/living.webp
          test -s visual/app/src/main/assets/corridor.webp
          test -s visual/app/src/main/assets/room.webp
          test -s visual/app/src/main/assets/anomaly.webp
          file visual/app/src/main/assets/*.webp

      - name: Build release APK
        working-directory: visual
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$GITHUB_WORKSPACE/visual/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$GITHUB_WORKSPACE/13cards-visual-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/13cards-error-in-deck-visual.apk"
          KEYSTORE="$RUNNER_TEMP/13cards-visual.jks"
          PASS="$(openssl rand -hex 16)"
          test -s "$UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT/zipalign" -c -v 4 "$ALIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias cardsquestvisual -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Cards Quest Visual, OU=Personal, O=Cards Quest, C=RU"
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias cardsquestvisual --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee "$GITHUB_WORKSPACE/signature.txt"
          "$BT/aapt2" dump badging "$FINAL" | tee "$GITHUB_WORKSPACE/badging.txt"
          sha256sum "$FINAL" | tee "$GITHUB_WORKSPACE/sha256.txt"
          test "$(stat -c%s "$FINAL")" -gt 100000
          ls -lh "$FINAL"

      - name: Upload playable visual APK
        uses: actions/upload-artifact@v4
        with:
          name: 13cards-playable-visual-chapter1
          path: |
            13cards-error-in-deck-visual.apk
            signature.txt
            badging.txt
            sha256.txt
          if-no-files-found: error
          retention-days: 30
