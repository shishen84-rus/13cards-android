name: Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore game project and isolate package ID
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$GITHUB_WORKSPACE/game-project"
          mkdir -p "$GITHUB_WORKSPACE/game-project"
          cat payload/part1.b64 payload/part2.b64 payload/part3.b64 payload/part4.b64 | base64 --decode > /tmp/cardsquest.tar.gz
          tar -xzf /tmp/cardsquest.tar.gz -C "$GITHUB_WORKSPACE/game-project"
          BUILD="$GITHUB_WORKSPACE/game-project/app/build.gradle"
          test -f "$BUILD"
          sed -i "s/applicationId 'com.shishen84.cardsquest'/applicationId 'com.shishen84.cardsquest.release'/" "$BUILD"
          sed -i "s/versionCode 3/versionCode 4/" "$BUILD"
          sed -i "s/versionName '0.3.0'/versionName '0.4.0-release'/" "$BUILD"
          cat "$BUILD"

      - name: Build unsigned release APK
        working-directory: game-project
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Create release key and sign APK
        shell: bash
        run: |
          set -euxo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$GITHUB_WORKSPACE/game-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$GITHUB_WORKSPACE/13cards-release-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/13cards-error-in-deck-release.apk"
          KEYSTORE="$RUNNER_TEMP/13cards-release-test.jks"
          PASS='CardsQuest-2026-TestKey'
          test -s "$UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias cardsquest -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Cards Quest Release, OU=Personal, O=Cards Quest, L=Moscow, C=RU"
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-key-alias cardsquest --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$FINAL" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$FINAL" | tee "$GITHUB_WORKSPACE/signature.txt"
          "$BT/aapt2" dump badging "$FINAL" | tee "$GITHUB_WORKSPACE/badging.txt"
          sha256sum "$FINAL" | tee "$GITHUB_WORKSPACE/sha256.txt"
          ls -lh "$FINAL"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: 13cards-signed-release-apk
          path: |
            13cards-error-in-deck-release.apk
            signature.txt
            badging.txt
            sha256.txt
          if-no-files-found: error
          retention-days: 30
